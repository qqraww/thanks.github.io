<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        
        .card {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .heart {
            position: relative;
            width: 100px;
            height: 90px;
            opacity: 0;
            transform: scale(0);
            animation: heartBeat 1.5s ease-in-out 1s forwards, 
                       heartPulse 1.5s ease-in-out 2.5s infinite alternate;
        }
        
        .heart:before,
        .heart:after {
            position: absolute;
            content: "";
            left: 50px;
            top: 0;
            width: 50px;
            height: 80px;
            background: #ff3366;
            border-radius: 50px 50px 0 0;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.7);
        }
        
        .heart:after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }
        
        .message {
            margin-top: 50px;
            font-size: 2.5rem;
            color: white;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 2s ease-in-out 2s forwards;
            text-align: center;
            max-width: 90%;
        }
        
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            animation: particleFall linear infinite;
        }
        
        @keyframes heartBeat {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        @keyframes heartPulse {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 5px rgba(255, 51, 102, 0.7));
            }
            100% {
                transform: scale(1.15);
                filter: drop-shadow(0 0 20px rgba(255, 51, 102, 0.9));
            }
        }
        
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes particleFall {
            0% {
                transform: translateY(-10px) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(calc(100vh + 10px)) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        .letter-animation {
            display: inline-block;
            opacity: 0;
            animation: letterAppear 0.3s forwards;
            animation-delay: calc(var(--i) * 0.1s);
        }
        
        @keyframes letterAppear {
            0% {
                opacity: 0;
                transform: translateY(10px) rotate(10deg);
                filter: blur(5px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) rotate(0deg);
                filter: blur(0);
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="particles" id="particles"></div>
        <div class="heart"></div>
        <div class="message" id="message"></div>
    </div>
    
    <script>
        // Анимированный текст
        const message = "Спасибоㅤзаㅤто,ㅤчтоㅤтыㅤрядом";
        const messageElement = document.getElementById('message');
        
        for (let i = 0; i < message.length; i++) {
            const span = document.createElement('span');
            span.classList.add('letter-animation');
            span.style.setProperty('--i', i);
            span.textContent = message[i];
            messageElement.appendChild(span);
        }
        
        // Создание частиц
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Случайные размеры
                const size = Math.random() * 7 + 3;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // Случайные начальные позиции
                const xPos = Math.random() * 100;
                particle.style.left = `${xPos}%`;
                
                // Случайное время анимации и задержка
                const animationDuration = Math.random() * 10 + 10;
                const animationDelay = Math.random() * 5;
                particle.style.animationDuration = `${animationDuration}s`;
                particle.style.animationDelay = `${animationDelay}s`;
                
                // Случайный цвет
                const hue = Math.random() * 60 + 320; // Оттенки розового и фиолетового
                const lightness = Math.random() * 30 + 70; // Светлые оттенки
                particle.style.backgroundColor = `hsl(${hue}, 100%, ${lightness}%)`;
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // Запуск создания частиц при загрузке страницы
        window.addEventListener('load', createParticles);
        
        // Добавляем звуковой эффект при открытии страницы
        window.addEventListener('click', function() {
            const audio = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-magical-opener-transition-sound-2770.mp3');
            audio.volume = 0.5;
            audio.play().catch(e => console.log('Автовоспроизведение звука заблокировано браузером'));
        });
    </script>
</body>
</html>
